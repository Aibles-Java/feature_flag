name: CI

# CI + CD in one file. Each job gates itself by event with `if:` (a workflow
# has a single `on:` for all jobs):
#   - test    : every PR into develop/main + direct pushes + `v*` tags
#   - publish : push to `main` or a `v*` tag — build, Trivy-scan, push to GHCR (issue #34)
#   - deploy  : `v*` tag (after publish) OR a manual `workflow_dispatch` run
#               that deploys an already-published GHCR version — pull + `compose up`
# (Workflow name stays "CI" so the Slack app scope + branch-protection checks
# that key on it keep working; the file is `workflow.yml` because it does both.)
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ['v*']
  # Manual deploy of an image already in GHCR (e.g. to test the CD path without
  # cutting a real release tag). `publish` is skipped on dispatch, so the given
  # version MUST already have been published by a prior tag run.
  workflow_dispatch:
    inputs:
      version:
        description: 'GHCR image version to deploy, e.g. 1.2.3 (must already exist in GHCR)'
        required: true

# A newer push to the same ref cancels an in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs unit tests, then the JaCoCo report + coverage-ratchet check (bound to verify).
      - name: Build, test & coverage
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

  # Publishes a versioned image to GHCR (issue #34). Only on a push (never a
  # PR — forks can't be trusted with registry credentials) to `main` or a
  # `vX.Y.Z` tag, and only once `test` is green: a red build never ships an
  # image. The image is built once with `load: true` (no push) so Trivy can
  # scan the exact bits about to ship; only a clean scan gets logged in and
  # pushed, reusing the same GHA layer cache so the second build is fast, not
  # a full rebuild.
  publish:
    name: Publish Docker image (GHCR)
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Computes tags/labels from the triggering ref: semver (patch, minor,
      # major) on a `vX.Y.Z` tag push, `latest` only on a push to `main`.
      # Deliberately NOT metadata-action's `{{is_default_branch}}` — that
      # compares against this repo's actual configured GitHub default branch,
      # which is `develop` (Gitflow), not `main`. Since this job never runs
      # on a `develop` push (see the job `if:` above), `is_default_branch`
      # would always be false here, silently dropping the `latest` tag and,
      # on a bare `main` push with no tag in the same push, leaving `tags`
      # empty — which makes the push step below fail outright. Gate on the
      # actual ref instead. metadata-action lowercases `github.repository`
      # for us (GHCR requires a lowercase image path).
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image (local only, for scanning)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails the job on any HIGH/CRITICAL finding not covered by
      # .trivyignore (issue #34). The image above is never pushed if this
      # step fails — nothing HIGH/CRITICAL reaches GHCR, even transiently.
      # Scans by the first computed tag (documented trivy-action pattern) —
      # the local Docker daemon has that tag from the `load: true` build
      # above — rather than the raw imageid, which isn't a pattern any
      # first-party doc/example confirms as scannable.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-uses the cache populated above — this is a cache-hit rebuild, not a
      # fresh compile, since context and Dockerfile are unchanged.
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Continuous deployment to prod. Two entry points:
  #   - a `vX.Y.Z` tag push, gated on `publish` succeeding first, so the image
  #     deployed passed tests + a clean Trivy scan and is already in GHCR;
  #   - a manual `workflow_dispatch` run deploying an already-published version
  #     (publish is skipped, hence `always()` + the per-event checks below).
  # Runs on the self-hosted runner because the prod host sits on the internal
  # network; tags/dispatch are maintainer-only, so no untrusted fork code runs.
  deploy:
    name: Deploy to prod (self-hosted)
    needs: publish
    if: >-
      ${{ always() &&
      (github.event_name == 'workflow_dispatch' ||
       (startsWith(github.ref, 'refs/tags/v') && needs.publish.result == 'success')) }}
    runs-on: self-hosted
    # Serialize deploys and never cancel one mid-flight (a half-applied
    # `compose up` is worse than a queued deploy).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Derive the GHCR image ref. On a tag push: `v1.2.3` -> the `1.2.3` tag the
      # publish job produced via metadata-action's {{version}}. On a manual
      # dispatch: the `version` input verbatim. GHCR requires a lowercase path.
      # INPUT_VERSION is passed via env (never interpolated into the script) so
      # the untrusted dispatch input can't inject shell.
      - name: Resolve image tag
        id: img
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          repo="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}:${version}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the released image and bring the stack up. Liquibase runs on app
      # startup (ddl-auto=validate), so migrations apply here — no separate
      # step. Every value comes from repo/environment secrets; the prod
      # profile has no dev fallbacks (JwtProperties aborts without the secret).
      - name: Deploy with Docker Compose
        env:
          APP_IMAGE: ${{ steps.img.outputs.image }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps

      # Deployment gate: fail the job (and surface app logs) if the new
      # container never reports ready, so a bad release is visible immediately.
      - name: Verify deployment health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8081/actuator/health/readiness >/dev/null; then
              echo "App is healthy."
              exit 0
            fi
            echo "Waiting for app to become ready... ($i/30)"
            sleep 5
          done
          echo "App did not become healthy within the timeout."
          docker compose -f docker-compose.prod.yml logs --tail=100 app
          exit 1

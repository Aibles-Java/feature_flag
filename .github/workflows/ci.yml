name: CI

# Run the test suite (with JaCoCo coverage) on every PR into develop/main
# and on direct pushes to those branches.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# A newer push to the same ref cancels an in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs unit tests, then the JaCoCo report + coverage-ratchet check (bound to verify).
      - name: Build, test & coverage
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

name: CI

# Run the test suite (with JaCoCo coverage) on every PR into develop/main,
# on direct pushes to those branches, and on version tags (`v*`) — tag pushes
# additionally trigger the GHCR image publish job below (issue #34).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ['v*']

# A newer push to the same ref cancels an in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs unit tests, then the JaCoCo report + coverage-ratchet check (bound to verify).
      - name: Build, test & coverage
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn

  # Publishes a versioned image to GHCR (issue #34). Only on a push (never a
  # PR — forks can't be trusted with registry credentials) to `main` or a
  # `vX.Y.Z` tag, and only once `test` is green: a red build never ships an
  # image. The image is built once with `load: true` (no push) so Trivy can
  # scan the exact bits about to ship; only a clean scan gets logged in and
  # pushed, reusing the same GHA layer cache so the second build is fast, not
  # a full rebuild.
  publish:
    name: Publish Docker image (GHCR)
    needs: test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Computes tags/labels from the triggering ref: semver (patch, minor,
      # major) on a `vX.Y.Z` tag push, `latest` only on a push to `main`.
      # Deliberately NOT metadata-action's `{{is_default_branch}}` — that
      # compares against this repo's actual configured GitHub default branch,
      # which is `develop` (Gitflow), not `main`. Since this job never runs
      # on a `develop` push (see the job `if:` above), `is_default_branch`
      # would always be false here, silently dropping the `latest` tag and,
      # on a bare `main` push with no tag in the same push, leaving `tags`
      # empty — which makes the push step below fail outright. Gate on the
      # actual ref instead. metadata-action lowercases `github.repository`
      # for us (GHCR requires a lowercase image path).
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image (local only, for scanning)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fails the job on any HIGH/CRITICAL finding not covered by
      # .trivyignore (issue #34). The image above is never pushed if this
      # step fails — nothing HIGH/CRITICAL reaches GHCR, even transiently.
      # Scans by the first computed tag (documented trivy-action pattern) —
      # the local Docker daemon has that tag from the `load: true` build
      # above — rather than the raw imageid, which isn't a pattern any
      # first-party doc/example confirms as scannable.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-uses the cache populated above — this is a cache-hit rebuild, not a
      # fresh compile, since context and Dockerfile are unchanged.
      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

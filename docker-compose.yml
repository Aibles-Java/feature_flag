services:
  postgres:
    image: postgres:16-alpine
    container_name: ff_postgres
    environment:
      POSTGRES_DB: feature_flag_db
      POSTGRES_USER: ff_user
      POSTGRES_PASSWORD: ff_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ff_user -d feature_flag_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ff_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/feature_flag_db
      SPRING_DATASOURCE_USERNAME: ff_user
      SPRING_DATASOURCE_PASSWORD: ff_password
      APP_JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-long-random-secret}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: ff_postgres
    environment:
      POSTGRES_DB: feature_flag_db
      POSTGRES_USER: ff_user
      POSTGRES_PASSWORD: ff_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ff_user -d feature_flag_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ff_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the compose network the DB is reached by service name, not localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/feature_flag_db
      SPRING_DATASOURCE_USERNAME: ff_user
      SPRING_DATASOURCE_PASSWORD: ff_password
    ports:
      # Matches server.port=8081 / Dockerfile EXPOSE.
      - "8081:8081"
    # No container healthcheck yet: there is no health endpoint on this branch. Once an
    # Actuator health endpoint exists, add a HEALTHCHECK on /actuator/health/readiness here.

volumes:
  postgres_data:

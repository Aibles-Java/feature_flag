services:
  postgres:
    image: postgres:16-alpine
    container_name: ff_postgres
    # Local-dev defaults; override via environment or a git-ignored .env file
    # (see README.md "Environment variables").
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-feature_flag_db}
      POSTGRES_USER: ${POSTGRES_USER:-ff_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ff_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ff_user} -d ${POSTGRES_DB:-feature_flag_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ff_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The image defaults to SPRING_PROFILES_ACTIVE=prod, so every value below must be
      # supplied explicitly — the prod profile has no fallback to the local-dev defaults.
      # Inside the compose network the DB is reached by service name, not localhost.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-feature_flag_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ff_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ff_password}
      # Required by the prod profile (JwtProperties aborts startup without it).
      # Copy .env.example to .env and fill this in: openssl rand -hex 64
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env — >= 64 UTF-8 bytes, e.g. openssl rand -hex 64}
      # Also required by the prod profile, even with app.webhook.enabled=false — WebhookProperties
      # validation is unconditional (issue #36). NOT rotatable in place: see ADR-0005.
      APP_WEBHOOK_ENCRYPTION_KEY: ${APP_WEBHOOK_ENCRYPTION_KEY:?set APP_WEBHOOK_ENCRYPTION_KEY in .env — >= 64 UTF-8 bytes, e.g. openssl rand -hex 64}
    ports:
      # Matches server.port=8081 / Dockerfile EXPOSE.
      - "8081:8081"
    # The container healthcheck (/actuator/health/readiness) is inherited from the
    # Dockerfile HEALTHCHECK — no need to redeclare it here.

volumes:
  postgres_data:

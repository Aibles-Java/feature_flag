# ArchUnit configuration (issue #48 — Track A Tier-1 governance).
#
# FreezingArchRule baseline store. Only R7 (no package cycles) is frozen: the
# config <-> security cycle is pre-existing and structural (SecurityConfig wires
# the security filters; JwtTokenProvider reads config.JwtProperties). Freezing
# records today's violations so the rule gates *new* cycles without demanding a
# refactor of the security wiring as part of this change.
#
# The store is committed to the repo, so CI reads the same baseline. Adding a new
# cycle produces a violation that is not in the store and fails the build.
freeze.store.default.allowStoreCreation=true
freeze.store.default.path=src/test/resources/archunit_store

# Never auto-accept new violations — that would silently widen the baseline.
freeze.refreeze=false

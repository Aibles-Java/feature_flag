# ArchUnit configuration (issue #48 — Track A Tier-1 governance).
#
# FreezingArchRule baseline store. Only R7 (no package cycles) is frozen: the
# config <-> security cycle is pre-existing and structural (SecurityConfig wires
# the security filters; JwtTokenProvider reads config.JwtProperties). Freezing
# records today's violations so the rule gates *new* cycles without demanding a
# refactor of the security wiring as part of this change.
#
# The store is committed to the repo, so CI reads the same baseline. Adding a new
# cycle produces a violation that is not in the store and fails the build.
freeze.store.default.path=src/test/resources/archunit_store

# Store creation is DISABLED on purpose. With it enabled, a missing store (bad
# .gitignore, sparse/shallow checkout, an accidental `git rm`, an IDE run-config
# whose working directory isn't the module root) makes ArchUnit silently create a
# fresh baseline from whatever the code looks like right now and report GREEN —
# i.e. the gate passes precisely when it has lost its baseline. Verified: with the
# store moved aside and creation allowed, `mvn test` exits 0 and writes a new
# baseline. With creation disabled the run fails loudly instead, which is the
# correct behaviour for a gate.
#
# To legitimately re-freeze after a refactor that changes the recorded cycle:
# flip this to true, delete src/test/resources/archunit_store, run
# `./mvnw test -Dtest=ArchitectureTest`, flip it back, and commit the new store.
freeze.store.default.allowStoreCreation=false

# Never auto-accept new violations — this matches ArchUnit's own default, and is
# stated explicitly so the intent survives a future default change.
freeze.refreeze=false

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha-256-algorithm-ok
app.jwt.access-expiration-ms=86400000
app.jwt.refresh-expiration-ms=1209600000

# Rate limiting off by default in tests; the rate-limit test re-enables it with low limits.
app.rate-limit.enabled=false

# Metrics scraper credential for the Actuator management chain (issue #29). Set here so every
# @ActiveProfiles("test") @SpringBootTest shares one context (no per-test property override that
# would fork a second context and re-run Liquibase on the shared H2 db).
app.metrics.username=metrics
app.metrics.password=test-metrics-secret

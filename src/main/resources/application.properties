spring.application.name=feature_flag
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/feature_flag_db
spring.datasource.username=ff_user
spring.datasource.password=ff_password
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# JWT
# Local dev only — NOT a secret. Overridden by the APP_JWT_SECRET env var (Spring
# relaxed binding); the prod profile (application-prod.properties) requires the env var.
app.jwt.secret=local-dev-only-not-a-secret-feature-flag-jwt-signing-key-0123456789abcdef
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=1209600000

# Rate limiting (Bucket4j, in-memory per instance). Tune without code changes.
app.rate-limit.enabled=true
app.rate-limit.auth.capacity=10
app.rate-limit.auth.refill-period=1m
app.rate-limit.sdk.capacity=300
app.rate-limit.sdk.refill-period=1m

# Slack notifications
app.slack.enabled=false
app.slack.webhook-url=${SLACK_WEBHOOK_URL:}

# SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator — health probes (#25) + Prometheus metrics (#29). Expose only what we serve;
# /actuator/health is public, /actuator/prometheus and /actuator/info require HTTP Basic
# (see the SecurityConfig management chain) and should also sit behind a network policy.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Liveness stays process-only; readiness also reflects DB connectivity.
management.endpoint.health.group.readiness.include=readinessState,db
# Don't leak component/DB details to unauthenticated health callers.
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=feature_flag
info.app.description=Self-hosted Feature Flag Platform

# Prometheus scrape registry + metric hygiene (#29).
management.prometheus.metrics.export.enabled=true
# Bound HTTP server metric cardinality: cap unique URI tags (Micrometer already templates path vars).
management.metrics.web.server.max-uri-tags=100
# Common tag on every meter, so scrapes are attributable across instances.
management.metrics.tags.application=${spring.application.name}

# Dedicated scraper credential for /actuator/prometheus. Override the password via the
# APP_METRICS_PASSWORD env var in every real deployment — the default is intentionally blank.
app.metrics.username=metrics
app.metrics.password=${APP_METRICS_PASSWORD:}

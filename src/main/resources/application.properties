spring.application.name=feature_flag
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/feature_flag_db
spring.datasource.username=ff_user
spring.datasource.password=ff_password
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# JWT
app.jwt.secret=change-me-to-a-very-long-secret-key-at-least-512-bits-long-in-production-env
app.jwt.expiration-ms=86400000

# Rate limiting (Bucket4j, in-memory per instance). Tune without code changes.
app.rate-limit.enabled=true
app.rate-limit.auth.capacity=10
app.rate-limit.auth.refill-period=1m
app.rate-limit.sdk.capacity=300
app.rate-limit.sdk.refill-period=1m

# SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

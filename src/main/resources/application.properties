spring.application.name=feature_flag
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/feature_flag_db
spring.datasource.username=ff_user
spring.datasource.password=ff_password
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# JWT
# Local dev only — NOT a secret. Overridden by the APP_JWT_SECRET env var (Spring
# relaxed binding); the prod profile (application-prod.properties) requires the env var.
app.jwt.secret=local-dev-only-not-a-secret-feature-flag-jwt-signing-key-0123456789abcdef
app.jwt.expiration-ms=86400000

# SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

spring.application.name=feature_flag
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/feature_flag_db
spring.datasource.username=ff_user
spring.datasource.password=ff_password
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# JWT
app.jwt.secret=change-me-to-a-very-long-secret-key-at-least-512-bits-long-in-production-env
app.jwt.expiration-ms=86400000

# SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator — ops health for load balancers / Kubernetes probes / docker HEALTHCHECK.
# Only health + info are exposed over HTTP; all other actuator endpoints stay off.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Liveness stays process-only; readiness also reflects DB connectivity.
management.endpoint.health.group.readiness.include=readinessState,db
# Don't leak component/DB details to unauthenticated health callers.
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=feature_flag
info.app.description=Self-hosted Feature Flag Platform

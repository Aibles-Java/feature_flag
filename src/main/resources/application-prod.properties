# Production profile (SPRING_PROFILES_ACTIVE=prod).
#
# Every value below is an env-var placeholder WITHOUT a default on purpose: it
# neutralizes the local-dev defaults in application.properties so prod can never
# silently run on committed dev credentials.
#
# A missing variable aborts startup with a message naming it — but NOT via a
# "Could not resolve placeholder" error: the @ConfigurationProperties binder resolves
# non-strictly and passes an unresolved ${VAR} through as a literal string (see
# .claude/memory/conventions/springboot-configprops-binding-gotchas.md). So the naming
# is done by explicit prod-only startup checks: RequiredDataSourceEnvPostProcessor for
# SPRING_DATASOURCE_*, and JwtProperties bean validation for APP_JWT_SECRET.
# See README.md for the full list of required environment variables.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Must be >= 64 UTF-8 bytes (512 bits) and not a placeholder value — enforced at
# startup by JwtProperties bean validation. Generate with: openssl rand -hex 64
app.jwt.secret=${APP_JWT_SECRET}

# Encrypts webhook shared secrets at rest (AES-256-GCM). Same rules as the JWT secret,
# enforced at startup by WebhookProperties bean validation.
#
# WARNING: this key is NOT rotatable in place. Changing it makes every existing
# webhook_subscription.secret_ciphertext undecryptable, and each subscription must be
# re-created with a fresh secret. See docs/adr/ADR-0005.
app.webhook.encryption-key=${APP_WEBHOOK_ENCRYPTION_KEY}

# Comma-separated allowed CORS origins for the deployed frontend, e.g.
# https://app.example.com,https://admin.example.com. No default: prod must never fall back to the
# localhost dev origins. A missing variable surfaces as an unresolved ${...} placeholder at
# startup; SecurityConfig binds it to List<String> so the app fails fast if it is blank/malformed.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

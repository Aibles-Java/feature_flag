# Production profile (SPRING_PROFILES_ACTIVE=prod).
#
# Every value below is an env-var placeholder WITHOUT a default on purpose: it
# neutralizes the local-dev defaults in application.properties and makes startup
# abort with "Could not resolve placeholder '<VAR>'" when a variable is missing —
# prod can never silently run on committed dev credentials.
# See README.md for the full list of required environment variables.

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Must be >= 64 UTF-8 bytes (512 bits) and not a placeholder value — enforced at
# startup by JwtProperties bean validation. Generate with: openssl rand -hex 64
app.jwt.secret=${APP_JWT_SECRET}
